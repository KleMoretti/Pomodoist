name: Chinese Windows preview

on:
  workflow_dispatch:
  push:
    # Register this workflow in a fresh fork; feature builds still require dispatch.
    branches:
      - 'chinese'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    if: github.event_name == 'workflow_dispatch'
    name: Require the Chinese development branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject unsupported ref
        run: |
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/chinese ]]; then
            echo 'Fork releases must be dispatched from chinese. main is reserved for upstream synchronization.' >&2
            exit 64
          fi

  build-test:
    name: Build and verify unsigned EXE
    needs: validate-ref
    runs-on: windows-2022
    environment: windows-preview
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare application version
        id: version
        shell: bash
        run: |
          pubspec_version=$(awk '/^version:/ {sub(/\r$/, ""); print $2; exit}' pubspec.yaml)
          if [[ ! "$pubspec_version" =~ ^.+\+([0-9]+)$ ]]; then
            echo 'pubspec.yaml must contain a numeric build number after +.' >&2
            exit 64
          fi
          build_number="${BASH_REMATCH[1]}"
          release_version="${pubspec_version%+*}"
          echo "POMODOIST_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
      - run: flutter pub get
      - name: Generate translations and format changed sources
        run: |
          flutter gen-l10n
          if ($LASTEXITCODE -ne 0) { throw 'Localization generation failed.' }
          dart format lib/app/app_language.dart lib/app/app_l10n.dart lib/features/tasks/domain/task_models.dart lib/features/tasks/data/task_repository_impl.dart lib/features/tasks/presentation/task_detail_screen.dart lib/features/tasks/presentation/task_recurrence_button.dart test/chinese_recurrence_test.dart test/core_features_test.dart lib/features/focus/presentation/focus_preset_labels.dart lib/features/focus/presentation/focus_stage.dart lib/features/focus/presentation/focus_active_controls.dart lib/features/focus/presentation/focus_screen.dart lib/main.dart lib/app/personal_edition.dart lib/app/theme/app_theme.dart lib/features/billing/billing.dart lib/features/onboarding/onboarding_gate.dart lib/features/settings/presentation/settings_screen.dart lib/features/tasks/presentation/task_focus_launcher.dart lib/features/tasks/presentation/widgets/task_list_item.dart lib/features/tasks/presentation/kanban/kanban_screen.dart lib/features/focus/presentation/focus_start_dialog.dart test/personal_edition_test.dart test/task_focus_launcher_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed.' }
      - name: Save generated sources for SDK-free development
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: chinese-generated-sources
          path: |
            lib/l10n/app_localizations*.dart
            lib/app/app_language.dart
            lib/app/app_l10n.dart
            lib/features/tasks/domain/task_models.dart
            lib/features/tasks/data/task_repository_impl.dart
            lib/features/tasks/presentation/task_detail_screen.dart
            lib/features/tasks/presentation/task_recurrence_button.dart
            lib/features/focus/presentation/focus_preset_labels.dart
            lib/features/focus/presentation/focus_stage.dart
            lib/features/focus/presentation/focus_active_controls.dart
            lib/features/focus/presentation/focus_screen.dart
            test/chinese_recurrence_test.dart
            test/core_features_test.dart
            lib/main.dart
            lib/app/personal_edition.dart
            lib/app/theme/app_theme.dart
            lib/features/billing/billing.dart
            lib/features/onboarding/onboarding_gate.dart
            lib/features/settings/presentation/settings_screen.dart
            lib/features/tasks/presentation/task_focus_launcher.dart
            lib/features/tasks/presentation/widgets/task_list_item.dart
            lib/features/tasks/presentation/kanban/kanban_screen.dart
            lib/features/focus/presentation/focus_start_dialog.dart
            test/personal_edition_test.dart
            test/task_focus_launcher_test.dart
      - name: Analyze and run minimal feature tests
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Static analysis failed.' }
          flutter test --no-pub test/chinese_recurrence_test.dart test/personal_edition_test.dart test/task_focus_launcher_test.dart
          if ($LASTEXITCODE -ne 0) { throw 'Feature tests failed.' }
      - name: Test installer packaging boundary
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tool\windows\installer\test.ps1
      - name: Install Inno Setup 6.7.1
        run: |
          choco install innosetup --version=6.7.1 --yes --no-progress
          if (@(0, 1641, 3010) -notcontains $LASTEXITCODE) {
            throw "Chocolatey failed with exit code $LASTEXITCODE."
          }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Pinned Inno Setup compiler was not found: $compiler"
          }
          $expectedCompilerHash = 'EB6F4410C8DB367A5F74127E8025AD2CCACC0AFABBE783959D237DF3050F97FB'
          $actualCompilerHash = (
            Get-FileHash -LiteralPath $compiler -Algorithm SHA256
          ).Hash
          if ($actualCompilerHash -cne $expectedCompilerHash) {
            throw "Inno Setup compiler hash mismatch: $actualCompilerHash"
          }
      - name: Build local-mode feature preview
        run: >-
          flutter build windows --release
          --dart-define=POMODOIST_ENVIRONMENT=local
          --dart-define=POMODOIST_BILLING_CHANNEL=stripe
          --dart-define=POMODOIST_RELEASE=${{ github.sha }}
      - name: Compile installer and checksum with pinned compiler
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File .\tool\windows\installer\build.ps1 `
            -BuildDirectory build\windows\x64\runner\Release `
            -CompilerPath $compiler
      - name: Verify versions, unsigned boundary, and checksum
        run: |
          $installer = Resolve-Path build\windows\installer\Pomodoist-Setup.exe
          $installerInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($installer)
          $appPath = (Resolve-Path build\windows\x64\runner\Release\pomodoist.exe).Path
          $appInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($appPath)
          if ($installerInfo.ProductVersion.Trim() -cne $env:POMODOIST_VERSION -or
              $appInfo.ProductVersion.Split('+')[0] -cne $env:POMODOIST_VERSION) {
            throw "Expected $env:POMODOIST_VERSION; application: '$($appInfo.ProductVersion)', installer: '$($installerInfo.ProductVersion)'."
          }
          $numericVersion = '{0}.{1}.{2}.{3}' -f $installerInfo.FileMajorPart,
              $installerInfo.FileMinorPart, $installerInfo.FileBuildPart, $installerInfo.FilePrivatePart
          if ($numericVersion -cne (($env:POMODOIST_VERSION -split '-', 2)[0] + '.0')) {
            throw 'Installer numeric version does not match the release version.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Preview installer must remain unsigned; status was $($signature.Status)."
          }
          $expectedHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $checksum = (Get-Content -Raw "$installer.sha256").Trim()
          if ($checksum -cne "$expectedHash *Pomodoist-Setup.exe") {
            throw 'Installer checksum file does not match the release artifact.'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pomodoist-windows-exe
          path: |
            build/windows/installer/Pomodoist-Setup.exe
            build/windows/installer/Pomodoist-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Windows EXE
    environment: windows-preview
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pomodoist-windows-exe
          path: release
      - name: Publish manual GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-test.outputs.version }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          tag="chinese-preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          notes=$(cat <<EOF
          Unsigned Windows preview. Microsoft Defender SmartScreen may warn about an unknown publisher.

          Download \`Pomodoist-Setup.exe\`, open it, and Pomodoist will install for the current user and start automatically. This x64 preview runs on x64 Windows 10/11 and through x64 compatibility on Windows 11 Arm64.

          Source commit: ${GITHUB_SHA}
          Source branch: ${SOURCE_BRANCH}
          EOF
          )
          if [[ "$SOURCE_BRANCH" == chinese ]]; then
            notes+=$'\n\nLocal-mode feature preview: No local subscription requirements or purchase offers; bundled Noto Sans SC typography; shared focus setup with task selection and independent round targets. Includes revised Chinese wording and repeat date ranges. Development and releases now use the chinese branch; main remains reserved for upstream synchronization. Cloud sign-in and sync are not configured in this package.\n\nManual checks: confirm readable Chinese in both windows; verify onboarding/settings show no paid offers; start a Today task with a custom round count; select another task from Focus; cancel switching and confirm the running timer is preserved. Repeat ranges and saved language choice should still work.'
          fi
          printf '%s\n' "$notes" > "$RUNNER_TEMP/preview-notes.md"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Pomodoist $VERSION Chinese preview" \
            --notes-file "$RUNNER_TEMP/preview-notes.md" \
            release/Pomodoist-Setup.exe \
            release/Pomodoist-Setup.exe.sha256
